services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: firmeza-api
    container_name: firmeza-api
    ports:
      - "5246:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=firmeza;Username=firmeza;Password=coder1234"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@firmeza.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-Admin123*}"
      CLIENT_EMAIL: "${CLIENT_EMAIL:-cliente@firmeza.com}"
      CLIENT_PASSWORD: "${CLIENT_PASSWORD:-Cliente123*}"
      Auth__AdminUser: "${ADMIN_EMAIL:-admin@firmeza.com}"
      Auth__AdminPassword: "${ADMIN_PASSWORD:-Admin123*}"
      Auth__ClientUser: "${CLIENT_EMAIL:-cliente@firmeza.com}"
      Auth__ClientPassword: "${CLIENT_PASSWORD:-Cliente123*}"
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: src/Firmeza.Web
      dockerfile: Dockerfile
    image: firmeza-web
    container_name: firmeza-web
    ports:
      - "4200:80"
    environment:
      CLIENT_EMAIL: "${CLIENT_EMAIL:-cliente@firmeza.com}"
      CLIENT_PASSWORD: "${CLIENT_PASSWORD:-Cliente123*}"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: firmeza-db
    environment:
      POSTGRES_DB: firmeza
      POSTGRES_USER: firmeza
      POSTGRES_PASSWORD: coder1234
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firmeza -d firmeza"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data: