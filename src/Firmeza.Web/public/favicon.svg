<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1638"/>
      <stop offset="50%" stop-color="#12101F"/>
      <stop offset="100%" stop-color="#08070F"/>
    </linearGradient>

    <!-- Vibrant Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="40%" stop-color="#A78BFA"/>
      <stop offset="80%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- F Monogram Primary Gradient -->
    <linearGradient id="fTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="fMidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8B5CF6" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A78BFA" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Shield Geometry with Depth -->
  <path d="M 64 8 
           C 95 8, 114 19, 118 36 
           C 118 74, 98 105, 64 122 
           C 30 105, 10 74, 10 36 
           C 14 19, 33 8, 64 8 Z" 
        fill="url(#bgGrad)" 
        stroke="url(#borderGrad)" 
        stroke-width="4.5" 
        stroke-linejoin="round"
        filter="url(#shieldGlow)"/>

  <!-- Inner Architectural Accent Ring -->
  <path d="M 64 16 
           C 89 16, 105 25, 108 39 
           C 108 70, 91 97, 64 111 
           C 37 97, 20 70, 20 39 
           C 23 25, 39 16, 64 16 Z" 
        fill="none" 
        stroke="#A78BFA" 
        stroke-width="1.5" 
        stroke-opacity="0.25"
        stroke-dasharray="6 3"/>

  <!-- Monogram "F" - Bold, Monolithic, Executive Structure -->
  <g filter="url(#innerGlow)">
    <!-- Vertical Pillar -->
    <rect x="44" y="34" width="13" height="60" rx="3.5" fill="url(#fTopGrad)"/>
    
    <!-- Top Horizontal Bar with Chamfered Dynamic Edge -->
    <path d="M 44 34 
             H 84 
             C 87 34, 88.5 36.5, 87 39 
             L 83 45 
             C 82 46.5, 80 46.5, 78 46.5 
             H 57 
             V 34 Z" 
          fill="url(#fTopGrad)"/>

    <!-- Middle Horizontal Accent Bar -->
    <path d="M 44 57 
             H 74 
             C 76.5 57, 78 59, 76.5 61.5 
             L 73.5 66.5 
             C 72.5 68, 70.5 68, 69 68 
             H 57 
             V 57 Z" 
          fill="url(#fMidGrad)"/>
  </g>

  <!-- Top Apex Diamond Jewel -->
  <polygon points="64,19 71,28 57,28" fill="#DDD6FE" opacity="0.9"/>
</svg>
