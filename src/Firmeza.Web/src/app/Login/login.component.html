<div class="login-split-page">
  <!-- Columna Izquierda: Formulario de Ingreso (Centrado verticalmente, max-width 360px) -->
  <div class="login-col-form">
    <div class="login-form-box">
      <!-- Logotipo único en la parte superior izquierda del formulario -->
      <div class="sidebar-brand mb-4">
        <span class="sidebar-brand-mark">F</span>
        <span>Firmeza</span>
      </div>

      <!-- Título y Subtítulo corporativo -->
      <h1 class="h2 mb-1" style="font-size: 22px;">Iniciar sesión</h1>
      <p class="text-secondary small mb-4">Ingresa con tu correo y contraseña</p>

      <form (ngSubmit)="onSubmit()" novalidate>
        <!-- Campo Correo -->
        <div class="mb-3">
          <label for="email" class="form-label">
            Correo electrónico <span class="req-star">*</span>
          </label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            [class.is-invalid]="emailError"
            placeholder="usuario@firmeza.com"
            [(ngModel)]="email"
            (input)="validateForm()"
            autocomplete="email"
            required>
          <div *ngIf="emailError" class="form-error">
            {{ emailError }}
          </div>
        </div>

        <!-- Campo Contraseña con botón de ícono ojo -->
        <div class="mb-4">
          <label for="password" class="form-label">
            Contraseña <span class="req-star">*</span>
          </label>
          <div class="position-relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              class="form-control font-mono pe-5"
              [class.is-invalid]="passwordError"
              placeholder="••••••••"
              [(ngModel)]="password"
              (input)="validateForm()"
              autocomplete="current-password"
              required>
            <button
              type="button"
              class="btn-icon-eye"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              [title]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
          <div *ngIf="passwordError" class="form-error">
            {{ passwordError }}
          </div>
        </div>

        <!-- Mensaje de error de credenciales inline sobre el botón -->
        <div *ngIf="errorMessage" class="login-error-inline d-flex align-items-start gap-1">
          <i class="bi bi-exclamation-circle flex-shrink-0 mt-0.5"></i>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Mensaje de éxito si aplica -->
        <div *ngIf="successMessage" class="alert alert-success py-2 small d-flex align-items-center gap-2 mb-3">
          <i class="bi bi-check-circle flex-shrink-0"></i>
          <div>{{ successMessage }}</div>
        </div>

        <!-- Botón de Envío -->
        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="isLoading">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1" role="status"></span>
          <span>{{ isLoading ? 'Ingresando...' : 'Entrar' }}</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Columna Derecha: Panel #1F3A5F con rejilla tenue y F geométrica grande con opacidad 6-8% -->
  <div class="login-col-cover">
    <span class="login-f-watermark">F</span>
  </div>
</div>
