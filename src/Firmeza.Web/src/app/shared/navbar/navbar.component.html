<aside class="app-sidebar">
  <!-- Cabecera de Barra Lateral con Logotipo -->
  <div class="sidebar-header">
    <a class="sidebar-brand" [routerLink]="isCliente ? '/cliente' : '/'">
      <span class="sidebar-brand-mark">F</span>
      <span>Firmeza</span>
    </a>
  </div>

  <!-- Navegación Principal -->
  <nav class="sidebar-nav">
    <!-- Enlace General (Inicio): solo para usuarios no-clientes (visitantes o administradores) -->
    <ng-container *ngIf="!isCliente">
      <div class="sidebar-section-title">General</div>
      <a class="sidebar-nav-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <i class="bi bi-grid-1x2"></i>
        <span>Inicio</span>
      </a>
    </ng-container>

    <!-- Enlaces para Administradores -->
    <ng-container *ngIf="isAdmin">
      <div class="sidebar-section-title">Administración</div>
      <a class="sidebar-nav-item" routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <i class="bi bi-speedometer2"></i>
        <span>Dashboard</span>
      </a>
      <a class="sidebar-nav-item" routerLink="/admin/clientes" routerLinkActive="active">
        <i class="bi bi-people"></i>
        <span>Clientes</span>
      </a>
      <a class="sidebar-nav-item" routerLink="/admin/empresas" routerLinkActive="active">
        <i class="bi bi-buildings"></i>
        <span>Empresas</span>
      </a>
    </ng-container>

    <!-- Enlace para Clientes: una sola entrada "Mi portal" (sin Inicio duplicado) -->
    <ng-container *ngIf="isCliente">
      <div class="sidebar-section-title">Portal</div>
      <a class="sidebar-nav-item" routerLink="/cliente" routerLinkActive="active">
        <i class="bi bi-person-vcard"></i>
        <span>Mi portal</span>
      </a>
    </ng-container>
  </nav>

  <!-- Pie de Barra Lateral: Usuario en Plex Sans, Rol y Cerrar Sesión sin borde -->
  <div class="sidebar-footer">
    <div *ngIf="currentUser; else notLoggedIn">
      <div class="mb-2">
        <div class="text-truncate fw-medium text-main font-sans" style="font-size: 13px;" [title]="currentUser.email">
          {{ currentUser.email }}
        </div>
        <div class="text-secondary font-sans" style="font-size: 11.5px;">
          {{ currentUser.role }}
        </div>
      </div>
      <button type="button" (click)="logout()" class="sidebar-logout-btn">
        <i class="bi bi-box-arrow-right"></i>
        <span>Cerrar sesión</span>
      </button>
    </div>

    <ng-template #notLoggedIn>
      <a routerLink="/Login" class="btn btn-primary btn-sm w-100 justify-content-center">
        <i class="bi bi-lock"></i>
        <span>Iniciar Sesión</span>
      </a>
    </ng-template>
  </div>
</aside>
