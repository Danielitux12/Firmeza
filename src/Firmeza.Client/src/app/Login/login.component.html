<style>
  :host {
    --navy-900: #0f1f38;
    --navy-800: #16294a;
    --steel-600: #1f4e8c;
    --steel-700: #193f72;
    --ink: #1b2431;
    --slate: #4a5568;
    --rule: #d3d9e2;
    --paper: #f5f6f8;
    --danger: #a4262c;

    display: block;
    height: 100dvh;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  .login-page {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: minmax(280px, 5fr) minmax(360px, 7fr);
    background: var(--paper);
  }

  /* Panel de marca */
  .login-brand {
    background: var(--navy-900);
    color: #fff;
    padding: 3rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-right: 4px solid var(--steel-600);
  }

  .brand-name {
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0;
  }

  .brand-statement {
    max-width: 30ch;
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    font-size: 1.5rem;
    line-height: 1.4;
    margin: 0;
    color: #e6ebf3;
  }

  .brand-note {
    margin: 0;
    font-size: 0.8rem;
    color: #a9b6cc;
  }

  /* Panel de formulario */
  .login-main {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem 1.5rem;
    background: #fff;
  }

  .login-card {
    width: 100%;
    max-width: 380px;
  }

  .login-header {
    margin-bottom: 2rem;
  }

  .login-header h1 {
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    font-size: 1.75rem;
    font-weight: 600;
    color: var(--navy-900);
    margin: 0 0 0.4rem 0;
  }

  .login-header p {
    color: var(--slate);
    margin: 0;
    font-size: 0.95rem;
  }

  .login-form {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .form-group label {
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--ink);
  }

  .form-group input {
    padding: 0.7rem 0.8rem;
    border: 1px solid #b7c0cc;
    border-radius: 0.25rem;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .form-group input::placeholder {
    color: #8a94a3;
  }

  .form-group input:hover {
    border-color: #8792a2;
  }

  .form-group input:focus-visible {
    outline: none;
    border-color: var(--steel-600);
    box-shadow: 0 0 0 3px rgba(31, 78, 140, 0.2);
  }

  .form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    font-size: 0.875rem;
  }

  .remember-me {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--slate);
    cursor: pointer;
  }

  .remember-me input {
    width: 1rem;
    height: 1rem;
    accent-color: var(--steel-600);
  }

  .forgot-link,
  .login-footer a {
    color: var(--steel-600);
    text-decoration: none;
    font-weight: 500;
  }

  .forgot-link:hover,
  .login-footer a:hover {
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .forgot-link:focus-visible,
  .login-footer a:focus-visible {
    outline: 2px solid var(--steel-600);
    outline-offset: 2px;
    border-radius: 2px;
  }

  .btn-login {
    background: var(--navy-800);
    color: #fff;
    border: 1px solid var(--navy-800);
    padding: 0.8rem;
    border-radius: 0.25rem;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  .btn-login:hover {
    background: var(--steel-700);
    border-color: var(--steel-700);
  }

  .btn-login:focus-visible {
    outline: 3px solid rgba(31, 78, 140, 0.4);
    outline-offset: 2px;
  }

  .login-footer {
    margin-top: 1.75rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    font-size: 0.875rem;
    color: var(--slate);
  }

  .login-footer p {
    margin: 0;
  }

  .alert-error {
    background-color: #fde8e8;
    color: #9b1c1c;
    border: 1px solid #f8b4b4;
    padding: 0.75rem 1rem;
    border-radius: 0.25rem;
    font-size: 0.875rem;
    margin-bottom: 1.25rem;
  }

  .alert-success {
    background-color: #def7ec;
    color: #03543f;
    border: 1px solid #bcf0da;
    padding: 0.75rem 1rem;
    border-radius: 0.25rem;
    font-size: 0.875rem;
    margin-bottom: 1.25rem;
  }

  /* Móvil: se oculta el panel de marca y el nombre pasa al encabezado */
  @media (max-width: 800px) {
    .login-page {
      grid-template-columns: 1fr;
    }

    .login-brand {
      padding: 1.25rem 1.5rem;
      border-right: none;
      border-bottom: 4px solid var(--steel-600);
    }

    .brand-statement,
    .brand-note {
      display: none;
    }

    .brand-name {
      font-size: 1.5rem;
    }

    .login-main {
      align-items: flex-start;
      padding-top: 2.5rem;
    }
  }
</style>

<div class="login-page">
  <aside class="login-brand">
    <h2 class="brand-name">Firmeza</h2>
    <p class="brand-statement">Acceso exclusivo para usuarios autorizados.</p>
    <p class="brand-note">© 2026 Firmeza. Todos los derechos reservados.</p>
  </aside>

  <main class="login-main">
    <div class="login-card">
      <div class="login-header">
        <h1>Iniciar sesión</h1>
        <p>Ingresa tus credenciales para acceder a tu cuenta.</p>
      </div>

      <div *ngIf="errorMessage" class="alert-error">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="alert-success">
        {{ successMessage }}
      </div>

      <form class="login-form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="usuario">Correo electrónico</label>
          <input
            type="email"
            id="usuario"
            name="usuario"
            placeholder="correo@ejemplo.com"
            autocomplete="email"
            [(ngModel)]="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Contraseña"
            autocomplete="current-password"
            [(ngModel)]="password"
            required
          />
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" />
            <span>Mantener sesión iniciada</span>
          </label>
          <a routerLink="/" class="forgot-link">Volver al inicio</a>
        </div>

        <button type="submit" class="btn-login" [disabled]="isLoading">
          {{ isLoading ? 'Iniciando sesión...' : 'Iniciar sesión' }}
        </button>
      </form>

      <div class="login-footer">
        <p>¿Aún no tienes cuenta? <a href="#">Solicitar acceso</a></p>
      </div>
    </div>
  </main>
</div>
